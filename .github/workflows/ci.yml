name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The oldest Swift the code must build with; local toolchains may be newer (CLAUDE.md → Commands).
env:
  SWIFT_VERSION: "6.3"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The cheap checks run on Linux every time; the Swift jobs (macOS, and Core on Linux, ADR-0007) run
# only when a change can affect Swift code or its fixtures. A job skipped by its condition counts as
# passed for a required check, so a docs-only pull request can merge. The guard in CI is guard.yml.
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      swift: ${{ steps.changes.outputs.swift }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Does the change touch Swift code, its fixtures or this workflow?
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # No usable base (first push, force push): run the Swift job to be safe.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A diff that fails (a base the clone lacks) runs the Swift job too: `bash -e` would
          # otherwise end the step here and skip it.
          if ! changed=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='\.swift$|(^|/)Package\.resolved$|^bridge/|^fixtures/|^project\.yml$|^Apps/|^scripts/(pin-app-packages\.sh|require-tests\.mjs|check-project-scripts\.mjs|check-calendar-isolation\.test\.mjs)$|^\.github/workflows/ci\.yml$'
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read-boundary hook (Read, Grep, Glob), its command and the template's deny rules
        run: |
          python3 -m unittest discover -s .claude/hooks -p 'test_*.py'
          node --test scripts/hook-command.test.mjs

      - name: Core imports (ADR-0001)
        run: |
          node --test scripts/check-core-imports.test.mjs
          scripts/check-core-imports.sh

      - name: No vault writes before the Write phase, no calendar writes before the Act phase (ADR-0015, ADR-0012)
        run: |
          node --test scripts/check-vault-writes.test.mjs
          node scripts/check-vault-writes.mjs

      - name: String Catalogs (banned words, plural categories; ADR-0009)
        run: |
          node --test scripts/check-catalog.test.mjs
          node scripts/check-catalog.mjs

      - name: project.yml runs no command and reads nothing outside the repository (XcodeGen and xcodebuild run outside the sandbox)
        run: |
          node --test scripts/check-project-scripts.test.mjs
          node scripts/check-project-scripts.mjs

      - name: Test steps fail when no test ran
        run: node --test scripts/require-tests.test.mjs

      - name: Demo snapshot is the generator's output
        run: node --test scripts/demo-snapshot.test.mjs

      - name: Push and post guard (pre-push hook, gh-post, install script) and the guard in CI (scan, workflow rules)
        run: node --test scripts/matcher.test.mjs scripts/pre-push.test.mjs scripts/gh-post.test.mjs scripts/install-guard.test.mjs scripts/guard-scan.test.mjs scripts/guard-workflow.test.mjs

      - name: Markdown format check
        run: |
          npm ci
          npx prettier --check '**/*.md'

      - name: Markdown references (links, wikilinks, ADR numbers, repo paths)
        run: |
          node --test scripts/check-refs.test.mjs
          node scripts/check-refs.mjs

  # Core builds and tests on Linux (ADR-0007). The official Swift image, pinned by digest
  # (swift:6.3-noble = 6.3.3, pushed 2026-10-27); Core has no package dependencies, so the container
  # runs without a network. The image has no node, so the test count is read on the runner.
  core-linux:
    needs: docs
    if: ${{ !cancelled() && needs.docs.outputs.swift == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SWIFT_IMAGE: swift:6.3-noble@sha256:1038d54c80063f5cdfabc4560990c30af64b5de8ebf28161deb22ca4ad5db866
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Core tests on Linux
        shell: bash
        run: |
          docker run --rm --network none -v "$PWD:/w" -w /w "$SWIFT_IMAGE" \
            swift test --package-path MoonShineCore 2>&1 | tee "$RUNNER_TEMP/core-linux-tests.log"
          node scripts/require-tests.mjs "$RUNNER_TEMP/core-linux-tests.log" Core-Linux

  swift:
    needs: docs
    if: ${{ !cancelled() && needs.docs.outputs.swift == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select the newest stable Xcode with Swift ${{ env.SWIFT_VERSION }}
        id: xcode
        run: |
          # Newest first; the first stable Xcode whose Swift is the pinned version wins. None: fail.
          for xcode in $(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -rV); do
            swift="$xcode/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
            if [ -x "$swift" ] && "$swift" --version 2>/dev/null | grep -qE "Swift version ${SWIFT_VERSION//./\\.}([.[:space:]]|$)"; then
              sudo xcode-select -s "$xcode"
              xcodebuild -version
              swift --version
              echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' '-')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No stable Xcode on this runner has Swift $SWIFT_VERSION. Installed:" >&2
          for xcode in /Applications/Xcode_*.app; do
            echo "  $xcode: $("$xcode/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift" --version 2>&1 | head -1)" >&2
          done
          exit 1

      - name: Cache .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            MoonShineCore/.build
            Adapters/.build
          # A restore falls back only to a cache of the same Xcode and the same pinned packages.
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('**/Package.resolved') }}-${{ hashFiles('**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('**/Package.resolved') }}-

      # Each test step fails when it ran no test (`scripts/require-tests.mjs`).
      - name: Core tests
        shell: bash
        run: |
          swift test --package-path MoonShineCore 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
          node scripts/require-tests.mjs "$RUNNER_TEMP/core-tests.log" Core

      - name: Adapter tests
        shell: bash
        run: |
          swift test --package-path Adapters 2>&1 | tee "$RUNNER_TEMP/adapter-tests.log"
          node scripts/require-tests.mjs "$RUNNER_TEMP/adapter-tests.log" Adapters

      - name: A file without `import EventKit` cannot reach the event store (ADR-0012)
        run: node --test scripts/check-calendar-isolation.test.mjs

      - name: XcodeGen (pinned release, checksum checked)
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Mac app tests (Demo mode)
        shell: bash
        run: |
          node scripts/check-project-scripts.mjs
          xcodegen generate
          scripts/pin-app-packages.sh
          xcodebuild -scheme MoonShineMac -destination platform=macOS,arch=arm64 \
            -derivedDataPath DerivedData -onlyUsePackageVersionsFromResolvedFile test \
            2>&1 | tee "$RUNNER_TEMP/app-tests.log"
          node scripts/require-tests.mjs "$RUNNER_TEMP/app-tests.log" App

      - name: Swift format lint
        run: swift format lint --strict --recursive MoonShineCore Adapters Apps
