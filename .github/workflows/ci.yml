name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two jobs: macOS minutes count ×10 in a private repository, so the Swift job runs only when a
# change can affect Swift code or its fixtures; the cheap checks run on Linux every time.
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      swift: ${{ steps.changes.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the change touch Swift code, its fixtures or this workflow?
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # No usable base (first push, force push): run the Swift job to be safe.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='\.swift$|(^|/)Package\.resolved$|^bridge/|^fixtures/|^project\.yml$|^\.github/workflows/ci\.yml$'
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$pattern"; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read-boundary hook (Read, Grep, Glob)
        run: python3 -m unittest discover -s .claude/hooks -p 'test_*.py'

      - name: Core imports (ADR-0001)
        run: |
          node --test scripts/check-core-imports.test.mjs
          scripts/check-core-imports.sh

      - name: No vault writes before the Write phase, no calendar writes before the Act phase (ADR-0015, ADR-0012)
        run: |
          node --test scripts/check-vault-writes.test.mjs
          node scripts/check-vault-writes.mjs

      - name: Markdown format check
        run: |
          npm ci
          npx prettier --check '**/*.md'

      - name: Markdown references (links, wikilinks, ADR numbers, repo paths)
        run: |
          node --test scripts/check-refs.test.mjs
          node scripts/check-refs.mjs

  swift:
    needs: docs
    if: ${{ !cancelled() && needs.docs.outputs.swift == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        id: xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: |
            MoonShineCore/.build
            Adapters/.build
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      - name: Core tests
        run: swift test --package-path MoonShineCore

      - name: Adapter tests
        run: swift test --package-path Adapters

      - name: A file without `import EventKit` cannot reach the event store (ADR-0012)
        run: node --test scripts/check-calendar-isolation.test.mjs

      - name: Swift format lint
        run: swift format lint --strict --recursive MoonShineCore Adapters
