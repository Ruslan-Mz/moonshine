name: Guard

# The guard in CI (CLAUDE.md → Commands → Guard; docs/setup/github.md). pull_request_target runs this
# file and scripts/ci/guard-scan.mjs as main holds them, so a pull request that edits either changes
# nothing until it is merged. No file of the pull request is checked out or run: its commits are
# fetched as data and scanned. The deny-list comes from the `guard` environment, whose deployment
# branch policy admits main only; every value from the event reaches the script through `env:`,
# never through a `run:` line. scripts/guard-workflow.test.mjs pins these rules.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A cancelled run would leave a pushed head or a range of main unscanned, so runs queue instead.
concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch the pull request's commits as data
        if: github.event_name == 'pull_request_target'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"

      - name: Scan for deny-list entries, vault paths and binary files (kinds only, never the text)
        env:
          EVENT: ${{ github.event_name }}
          BASE: origin/main
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DENY_LIST: ${{ secrets.DENY_LIST }}
        run: node scripts/ci/guard-scan.mjs
