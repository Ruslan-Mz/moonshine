<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone — Quick log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0A64D8}a:hover{color:#084FA8}
button{font:inherit;color:inherit;cursor:default}
</style>
</helmet>
<div dir="{{ss.dir}}" lang="{{ss.lang}}" style="width:402px;height:874px;box-sizing:border-box;position:relative;overflow:hidden;border-radius:48px;font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;font-size:17px;line-height:1.3;color:{{c.text}};background:{{i.bg}};-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;position:relative;"><div style="position:absolute;inset:0"><dc-import name="iPhoneToday" dark="{{dark}}" hint-size="402px,874px"></dc-import></div><div style="position:absolute;inset:0;background:{{i.scrim}}"></div><section role="dialog" style="position:absolute;left:0;right:0;bottom:0;height:700px;display:flex;flex-direction:column;gap:14px;padding:8px 18px 34px;box-sizing:border-box;border-radius:34px 34px 0 0;background:{{i.sheet}}"><div style="display:flex;justify-content:center"><span style="width:38px;height:5px;border-radius:3px;background:{{i.grabber}}"></span></div><div style="display:flex;align-items:center;height:44px"><button style="height:44px;padding:0 4px;border:0;background:transparent;font-size:17px;color:{{c.accent}}">Cancel</button><span style="flex:1;text-align:center;font-size:17px;font-weight:600">Log time</span><button style="height:44px;padding:0 4px;border:0;background:transparent;font-size:17px;font-weight:600;color:{{c.accent}}">Save</button></div><span style="font-size:13px;font-weight:600;color:{{c.ter}};padding:0 4px">LINE · recent first</span><div style="display:flex;gap:8px;overflow:hidden"><sc-for list="{{lines}}" as="l" hint-placeholder-count="5"><button onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;border:0;font-size:16px;background:{{l.bg}};color:{{l.fg}};font-weight:{{l.fw}}">{{l.e}} {{l.n}}</button></sc-for></div><span style="font-size:13px;font-weight:600;color:{{c.ter}};padding:0 4px">MINUTES</span><div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px"><sc-for list="{{mins}}" as="m" hint-placeholder-count="6"><button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="height:48px;border-radius:14px;border:0;font-size:17px;font-variant-numeric:tabular-nums;background:{{m.bg}};color:{{m.fg}};font-weight:{{m.fw}}">{{m.n}}</button></sc-for></div><div style="display:flex;align-items:center;gap:12px;height:52px;padding:0 6px 0 16px;border-radius:14px;background:{{i.cell}}"><span style="flex:1;font-size:17px;font-variant-numeric:tabular-nums">{{minL}}</span><span style="display:inline-flex;border-radius:10px;background:{{i.fill}}"><button onClick="{{dec}}" aria-label="5 minutes less" style="width:48px;height:40px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:{{c.text}}"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0"><path d="M3 8h10"></path></svg></button><span style="width:1px;margin:10px 0;background:{{i.sep}}"></span><button onClick="{{inc}}" aria-label="5 minutes more" style="width:48px;height:40px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:{{c.text}}"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0"><path d="M8 3v10M3 8h10"></path></svg></button></span></div><div style="display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:{{i.cell}}"><div style="display:flex;align-items:center;height:48px;padding:0 16px;border-bottom:1px solid {{i.sep}};font-size:17px"><span style="flex:1">When</span><span style="color:{{c.sec}}">Today, 18:40</span></div><label style="display:flex;align-items:center;height:48px;padding:0 16px"><span style="position:absolute;width:1px;height:1px;overflow:hidden">Note</span><input placeholder="Note (optional)" value="Allemande bars 1–8, slow" style="flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:{{c.text}}"></label></div><button style="height:54px;border:0;border-radius:27px;background:{{c.accentFill}};color:#FFFFFF;font-size:17px;font-weight:600">{{saveL}}</button><button style="display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border:0;border-radius:25px;background:{{i.fill}};color:{{c.accent}};font-size:17px;font-weight:600"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0"><path d="M5 3.5v9l7.5-4.5z"></path></svg>Start practice timer</button></section></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "lang": {"editor": "enum", "options": ["en", "ru", "he"], "default": "en"}, "$preview": {"width": 402, "height": 874}}'>

function theme(d) {
  return d ? {
    dark:true, window:'#1E1E21', sidebar:'#28272C', rail:'#232326', band:'#252528', text:'#EDEDF0', sec:'#A6A6AD', ter:'#8D8D95',
    sep:'rgba(255,255,255,0.08)', rowSep:'rgba(255,255,255,0.045)', chip:'rgba(255,255,255,0.075)', chipText:'#BDBDC4',
    accent:'#5A9DFF', accentFill:'#2F6BD0', selBg:'rgba(90,157,255,0.16)', navSel:'rgba(255,255,255,0.09)', check:'#64646C', checkDone:'#4C8DF0',
    dueText:'#FFC266', dueBg:'rgba(255,176,64,0.15)', card:'#2A2A2E', cardBorder:'rgba(255,255,255,0.07)',
    field:'rgba(255,255,255,0.07)', fieldBorder:'rgba(255,255,255,0.12)', badgeBorder:'rgba(255,255,255,0.2)', paused:'#7E7E86',
    windowBorder:'rgba(255,255,255,0.14)', rhythm:'#5E92EE', progress:'#3FA690', done:'#7E7E86', track:'rgba(255,255,255,0.07)',
    heat:'94,146,238', scrim:'rgba(0,0,0,0.42)', sheet:'#2A2A2E', shadow:'0 24px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.1)',
    band1:'rgba(94,146,238,0.22)', bandLine:'#5E92EE', grid:'rgba(255,255,255,0.07)', seg:'#4A5468', segAlt:'#596378', segText:'#EDEDF0',
    hatch:'rgba(255,255,255,0.22)', ctrl:'#3A3A3F', ctrlSel:'#5C5C63', knob:'#E6E6EA', future:'#B9A6F0'
  } : {
    dark:false, window:'#FFFFFF', sidebar:'#EFEEF2', rail:'#F8F8FA', band:'#F6F6F8', text:'#1D1D1F', sec:'#5F5F67', ter:'#74747C',
    sep:'rgba(0,0,0,0.08)', rowSep:'rgba(0,0,0,0.045)', chip:'rgba(0,0,0,0.045)', chipText:'#4F4F57',
    accent:'#0A64D8', accentFill:'#0A64D8', selBg:'rgba(10,100,216,0.08)', navSel:'rgba(0,0,0,0.07)', check:'#B4B4BB', checkDone:'#0A64D8',
    dueText:'#8A4B00', dueBg:'#FFEFD6', card:'#FFFFFF', cardBorder:'rgba(0,0,0,0.08)',
    field:'rgba(0,0,0,0.045)', fieldBorder:'rgba(0,0,0,0.12)', badgeBorder:'rgba(0,0,0,0.18)', paused:'#8E8E95',
    windowBorder:'rgba(0,0,0,0.16)', rhythm:'#2F68C8', progress:'#14917A', done:'#9A9AA2', track:'rgba(0,0,0,0.05)',
    heat:'47,104,200', scrim:'rgba(0,0,0,0.18)', sheet:'#FFFFFF', shadow:'0 24px 70px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.08)',
    band1:'rgba(47,104,200,0.16)', bandLine:'#2F68C8', grid:'rgba(0,0,0,0.06)', seg:'#C9D3E6', segAlt:'#B4C1DA', segText:'#1D2A44',
    hatch:'rgba(0,0,0,0.22)', ctrl:'#E4E4E8', ctrlSel:'#FFFFFF', knob:'#FFFFFF', future:'#5B3FA8'
  };
}
var SS = {
  en:{ lang:'en', dir:'ltr', today:'Today', week:'Week', month:'Month', lines:'Lines', search:'Search', demo:'Demo data', updated:'Updated 3 min ago',
       keys:'⌘1–⌘4 Views · ⌘K Search · ⌘R Refresh', tiers:{ foundation:'Foundation', active:'Active this season', maintenance:'Maintenance', paused:'Not in focus — on purpose' } },
  ru:{ lang:'ru', dir:'ltr', today:'Сегодня', week:'Неделя', month:'Месяц', lines:'Линии', search:'Поиск', demo:'Демо-данные', updated:'Обновлено 3 мин назад',
       keys:'⌘1–⌘4 Виды · ⌘K Поиск · ⌘R Обновить', tiers:{ foundation:'Фундамент', active:'Активные в сезоне', maintenance:'На поддержании', paused:'Не в фокусе — намеренно' } },
  he:{ lang:'he', dir:'rtl', today:'היום', week:'שבוע', month:'חודש', lines:'תחומים', search:'חיפוש', demo:'נתוני הדגמה', updated:'עודכן לפני 3 דק׳',
       keys:'⌘1–⌘4 תצוגות · ⌘K חיפוש · ⌘R רענון', tiers:{ foundation:'יסוד', active:'פעילים העונה', maintenance:'תחזוקה', paused:'לא בפוקוס — בכוונה' } }
};
var SIDE_T = [
  ['foundation', [['🧘','Core practice'],['💪','Calisthenics']], true],
  ['active', [['🎻','Violin'],['🇮🇹','Italian'],['🇯🇵','Japanese'],['📐','Math'],['🤖','AI/ML'],['🔬','Research'],['👨‍👩‍👧','Family']], true],
  ['maintenance', [['🎹','Piano']], true],
  ['paused', [['✒️','Calligraphy']], false]
];
function side(c, lang) {
  var ss = SS[lang] || SS.en;
  return SIDE_T.map(function (t) { var paused = t[0] === 'paused';
    return { n: ss.tiers[t[0]], open: t[2], count: t[2] ? '' : String(t[1].length), chev: t[2] ? 'M3.5 6L8 10.5 12.5 6' : (ss.dir === 'rtl' ? 'M10 3.5L5.5 8 10 12.5' : 'M6 3.5L10.5 8 6 12.5'),
      rows: t[1].map(function (r) { return { e:r[0], n:r[1], fg: paused ? c.paused : c.text, op: paused ? 0.5 : 1 }; }) }; });
}
function fmt(m) { if (m < 60) return '≈ ' + m + ' min est.'; var h = Math.floor(m / 60), r = m % 60; return '≈ ' + h + ' h' + (r ? ' ' + r + ' min' : '') + ' est.'; }
function short(m) { if (m < 60) return '≈ ' + m + ' min'; var h = Math.floor(m / 60), r = m % 60; return '≈ ' + h + ' h' + (r ? ' ' + r + ' min' : ''); }
var L = {
  violin:{e:'🎻',n:'Violin',a:'Spring recital 2027'},
  piano:{e:'🎹',n:'Piano',a:'Keep repertoire alive'},
  italian:{e:'🇮🇹',n:'Italian',a:'B1 by summer 2027'},
  japanese:{e:'🇯🇵',n:'Japanese',a:'Kana and first 300 words'},
  math:{e:'📐',n:'Math',a:'Linear algebra foundation'},
  ai:{e:'🤖',n:'AI/ML',a:'Eval toolkit v1'},
  research:{e:'🔬',n:'Research',a:'Practice-drift paper'},
  cal:{e:'💪',n:'Calisthenics',a:'20 strict pull-ups'},
  core:{e:'🧘',n:'Core practice',a:'Daily practice 2026'},
  family:{e:'👨‍👩‍👧',n:'Family',a:'Family year 2026'},
  life:{e:'🧺',n:'Life ops',a:'Household'}
};


function ios(c) {
  return c.dark ? {
    bg:'#000000', cell:'#1C1C1E', cell2:'#2C2C2E', sep:'rgba(84,84,88,0.45)', fill:'rgba(120,120,128,0.24)', fill2:'rgba(120,120,128,0.36)',
    bar:'rgba(30,30,32,0.86)', barBorder:'rgba(255,255,255,0.12)', panel:'#1C1C1E', sheet:'#1C1C1E', grabber:'rgba(235,235,245,0.3)',
    scrim:'rgba(0,0,0,0.5)', lift:'0 18px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.12)', hover:'rgba(255,255,255,0.07)',
    ghost:'rgba(120,120,128,0.18)', menu:'rgba(44,44,46,0.96)', wall:'#1D2330', ofbg:'#2C2C2E', island:'#000000'
  } : {
    bg:'#F2F2F7', cell:'#FFFFFF', cell2:'#F2F2F7', sep:'rgba(60,60,67,0.18)', fill:'rgba(120,120,128,0.12)', fill2:'rgba(120,120,128,0.2)',
    bar:'rgba(249,249,251,0.9)', barBorder:'rgba(0,0,0,0.08)', panel:'#FFFFFF', sheet:'#F2F2F7', grabber:'rgba(60,60,67,0.3)',
    scrim:'rgba(0,0,0,0.22)', lift:'0 18px 40px rgba(0,0,0,0.22), 0 0 0 1px rgba(0,0,0,0.06)', hover:'rgba(0,0,0,0.045)',
    ghost:'rgba(120,120,128,0.1)', menu:'rgba(250,250,252,0.97)', wall:'#C9D2DE', ofbg:'#E5E5EA', island:'#000000'
  };
}

var TB = { en:{ today:'Today', week:'Week', lines:'Lines', log:'Log' }, ru:{ today:'Сегодня', week:'Неделя', lines:'Линии', log:'Журнал' }, he:{ today:'היום', week:'שבוע', lines:'תחומים', log:'יומן' } };
var PL = { en:{ plan:'Plan' }, ru:{ plan:'План' }, he:{ plan:'תכנון' } };

function build(c) {
  var self = this, st = this.state || {}, ln = st.ln != null ? st.ln : 0, mn = st.mn != null ? st.mn : 20, i = ios(c);
  var LS = [['🎻','Violin'],['🧘','Core practice'],['💪','Calisthenics'],['📐','Math'],['🇮🇹','Italian']];
  return {
    dark: !!this.props.dark,
    lines: LS.map(function (l, k) { var on = k === ln; return { e:l[0], n:l[1], on:on, bg: on ? c.accentFill : i.cell, fg: on ? '#FFFFFF' : c.text, fw: on ? 600 : 400, pick: function () { self.setState({ ln: k }); } }; }),
    mins: [10,15,20,30,45,60].map(function (m) { var on = m === mn; return { n: m + ' min', on:on, bg: on ? c.selBg : i.cell, fg: on ? c.accent : c.text, fw: on ? 600 : 400, pick: function () { self.setState({ mn: m }); } }; }),
    minL: mn + ' min', dec: function () { self.setState({ mn: Math.max(5, mn - 5) }); }, inc: function () { self.setState({ mn: mn + 5 }); },
    saveL: 'Save ' + mn + ' min to ' + LS[ln][0] + ' ' + LS[ln][1]
  };
}


var __b = build;
build = function (c, lang) { var v = __b.call(this, c, lang) || {}; v.i = ios(c); v.tb = TB[lang] || TB.en; v.pl = PL[lang] || PL.en;
  if (typeof extra === 'function') { var x = extra.call(this, c, lang, v) || {}; for (var k in x) v[k] = x[k]; } return v; };

class Component extends DCLogic {
  renderVals() {
    var c = theme(!!this.props.dark);
    var v = build.call(this, c, this.props.lang || 'en') || {};
    var lang = this.props.lang || 'en'; v.c = c; v.ss = SS[lang] || SS.en; v.side = side(c, lang);
    return v;
  }
}
</script>
</body>
</html>
