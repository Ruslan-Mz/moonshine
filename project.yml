# XcodeGen spec for the Mac app (ADR-0007). `scripts/xcbuild.sh` checks it, generates
# `MoonShine.xcodeproj` (not committed), copies the pinned package versions and builds.
name: MoonShine
options:
  bundleIdPrefix: dev.moonshine
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  MoonShineCore:
    path: MoonShineCore
  Adapters:
    path: Adapters
# Signing: ad hoc, or the owner's Personal Team through a local file (Configs/Signing.xcconfig).
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # No App Sandbox and no hardened runtime yet: the JXA bridge needs an unsandboxed app
    # (ADR-0003).
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  MoonShineMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac/Sources
      - path: Apps/Mac/Resources
      # Demo mode reads the invented snapshot; the tests read the tracked file instead.
      - path: fixtures/omnifocus.snapshot.json
        buildPhase: resources
      # Live reads OmniFocus through the bridge (ADR-0003).
      - path: bridge/snapshot.js
        buildPhase: resources
    dependencies:
      - package: MoonShineCore
        product: MoonShineCore
      - package: MoonShineCore
        product: MoonShineFixtures
      - package: Adapters
        product: SQLiteStore
      - package: Adapters
        product: OmniFocusAdapter
      # Live reads its meta tag groups from `mapping.yaml` in the data folder (S4-4c-2).
      - package: Adapters
        product: ObsidianAdapter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moonshine.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MoonShine
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: MoonShine reads your OmniFocus tasks to show them. It never changes them.
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  MoonShineMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Apps/Mac/Tests
    dependencies:
      - target: MoonShineMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moonshine.mac.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MoonShineMac:
    build:
      targets:
        MoonShineMac: all
        MoonShineMacTests: [test]
    test:
      targets:
        - MoonShineMacTests
